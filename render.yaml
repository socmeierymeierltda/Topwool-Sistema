services:
  - type: web
    name: topwool-sistema
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /salud
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: topwool-db
          property: connectionString
      - key: WOO_URL
        value: https://www.topwool.cl
      - key: WOO_CONSUMER_KEY
        sync: false
      - key: WOO_CONSUMER_SECRET
        sync: false
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
      - key: PEDIDOS_SHEET_ID
        sync: false
      - key: PEDIDOS_TAB
        value: Pedidos
databases:
  - name: topwool-db
    plan: basic-256mb
